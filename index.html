<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イワイリフォーム | LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F1E6;
    --beige:#EAE0CB;
    --wood:#A97C50;
    --wood-deep:#7A5738;
    --ink:#3B2E24;
    --sage:#8B9A79;
    --line: rgba(59,46,36,0.14);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0 20px;
    background:
      radial-gradient(ellipse at top, rgba(169,124,80,0.10), transparent 55%),
      var(--cream);
  }

  .page{
    width:100%;
    max-width:440px;
    padding:56px 0 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* --- wood grain signature bar (縁側 motif) --- */
  .engawa{
    width:100%;
    height:14px;
    border-radius:8px;
    margin-bottom:34px;
    background:
      repeating-linear-gradient(
        90deg,
        var(--wood) 0px,
        var(--wood) 2px,
        #B8895C 2px,
        #B8895C 3px,
        var(--wood-deep) 3px,
        var(--wood-deep) 4.2px
      );
    background-size: 46px 100%;
    opacity:0.9;
    box-shadow: 0 2px 0 rgba(59,46,36,0.08);
  }

  .brand-mark{
    width:74px;
    height:74px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--beige), var(--cream));
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:20px;
  }
  .brand-mark svg{ width:38px; height:38px; }

  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.06em;
    margin:0 0 6px;
    text-align:center;
  }

  .sub{
    font-size:12.5px;
    letter-spacing:0.14em;
    color:var(--wood-deep);
    margin:0 0 40px;
    text-align:center;
  }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  a.card{
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding:20px 20px;
    background:#FFFDF9;
    border:1px solid var(--line);
    border-radius:16px;
    text-decoration:none;
    color:var(--ink);
    box-shadow: 0 1px 0 rgba(59,46,36,0.04);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  a.card:active{ transform: scale(0.98); }
  a.card:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -14px rgba(122,87,56,0.55);
    border-color: var(--wood);
  }

  .icon-box{
    flex:0 0 auto;
    width:46px;
    height:46px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-box.type-house{ background:#F1E6D3; }
  .icon-box.type-leaf{ background:#EAEFE3; }
  .icon-box svg{ width:24px; height:24px; }

  .card-text{ flex:1; min-width:0; }
  .card-title{
    font-weight:700;
    font-size:16px;
    margin:0 0 2px;
    line-height:1.4;
  }
  .card-desc{
    font-size:12.5px;
    color:#7A6A57;
    margin:0;
    line-height:1.5;
  }

  .card-arrow{ flex:0 0 auto; color:var(--wood); }

  footer{
    margin-top:48px;
    text-align:center;
  }
  footer p{
    font-size:11px;
    letter-spacing:0.08em;
    color:#9C8A72;
    margin:0;
  }

  @media (prefers-reduced-motion: reduce){
    a.card{ transition:none; }
  }
</style>
</head>
<body>
  <div class="page">

    <div class="engawa" aria-hidden="true"></div>

    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M8 24L24 10L40 24" stroke="#7A5738" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 21V38H35V21" stroke="#7A5738" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 38V28H27V38" stroke="#A97C50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1>イワイリフォーム</h1>
    <p class="sub">リフォームで家と家族が好きになる。</p>

    <nav class="links" aria-label="関連サイトへのリンク">

      <a class="card" href="https://www.iwai-reform.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon-box type-house" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 11L12 4L20 11" stroke="#7A5738" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6.5 9.5V19.5H17.5V9.5" stroke="#7A5738" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 19.5V14.5H14V19.5" stroke="#A97C50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="card-text">
          <p class="card-title">イワイリフォーム 公式サイト</p>
          <p class="card-desc">水まわりリフォーム専門サイト</p>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

      <a class="card" href="https://rinobe-nara-iwai.com/" target="_blank" rel="noopener noreferrer">
        <span class="icon-box type-leaf" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 19C5 19 5 8 16 5C16 5 18 15 8 19C6.5 19.5 5 19 5 19Z" stroke="#6E7A5F" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M6 18C9 15 12 12 15.5 6.5" stroke="#8B9A79" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="card-text">
          <p class="card-title">リノベならイワイ</p>
          <p class="card-desc">リノベーション専門サイト</p>
        </span>
        <span class="card-arrow" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </a>

    </nav>

    <footer>
      <p>株式会社リビングイワイ ｜ 奈良市西ノ京町151</p>
    </footer>

  </div>
</body>
</html>
