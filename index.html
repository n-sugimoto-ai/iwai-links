<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イワイリフォーム | LINKS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#DCEAE2;
    --mint-deep:#C7DDD1;
    --panel:#EAF3EE;
    --coral:#E38B68;
    --pine:#1F3B32;
    --pine-soft:#3E5B4F;
    --white:#FFFFFF;
    --line: rgba(31,59,50,0.14);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--panel);
    color:var(--pine);
    font-family:'Zen Kaku Gothic New', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HERO (illustration + title) ---------- */
  .hero{
    position:relative;
    min-height:46vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:48px 24px 56px;
    overflow:hidden;
    background:
      linear-gradient(180deg, #FFFFFF 0%, #F7F3EC 55%, #EFE6D8 100%);
  }

  /* light rays / genkan illustration, pure CSS */
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(115deg, transparent 40%, rgba(227,139,104,0.16) 41%, rgba(227,139,104,0.16) 46%, transparent 47%),
      linear-gradient(115deg, transparent 55%, rgba(227,139,104,0.10) 56%, rgba(227,139,104,0.10) 63%, transparent 64%);
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-40px;
    top:0;
    bottom:0;
    width:170px;
    background: linear-gradient(180deg, #C99566, #A97648);
    opacity:0.85;
    clip-path: polygon(30% 0, 100% 0, 100% 100%, 0% 100%);
  }

  .hero-content{ position:relative; z-index:2; }

  .roof-mark{ margin-bottom:10px; }
  .roof-mark svg{ width:120px; height:auto; }

  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.08em;
    line-height:1.5;
    margin:0 0 18px;
    color:var(--pine);
    white-space:nowrap;
  }

  .tagline{
    display:inline-block;
    padding:9px 22px;
    border:1.5px solid var(--pine);
    border-radius:999px;
    font-size:12.5px;
    letter-spacing:0.06em;
    color:var(--pine-soft);
    background:rgba(255,255,255,0.6);
    backdrop-filter: blur(2px);
  }

  /* ---------- LINK PANEL ---------- */
  .panel{
    flex:1;
    background:var(--mint);
    padding:36px 20px 56px;
    display:flex;
    justify-content:center;
  }

  .links{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  a.pill{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:16px 20px;
    background:var(--white);
    border:1.5px solid var(--pine);
    border-radius:999px;
    text-decoration:none;
    color:var(--pine);
    transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
  }
  a.pill:hover{
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -12px rgba(31,59,50,0.35);
    background:#F5FBF8;
  }
  a.pill:active{ transform: scale(0.98); }

  .pill-icon{
    flex:0 0 auto;
    width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--coral);
  }
  .pill-icon svg{ width:18px; height:18px; }

  .pill-text{
    flex:1;
    min-width:0;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.02em;
  }
  .pill-sub{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--pine-soft);
    margin-top:2px;
    letter-spacing:0.02em;
  }

  .pill-arrow{ flex:0 0 auto; color:var(--pine); opacity:0.7; }

  footer{
    text-align:center;
    margin-top:38px;
  }
  footer p{
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--pine-soft);
    margin:0;
    opacity:0.8;
  }

  /* ---------- Desktop: side-by-side like reference ---------- */
  @media (min-width: 760px){
    .wrap{
      flex-direction:row;
      min-height:100vh;
    }
    .hero{
      flex:0 0 46%;
      min-height:100vh;
      padding:40px;
    }
    .hero::after{ width:220px; }
    .panel{
      flex:1;
      align-items:center;
    }
  }
</style>
</head>
<body>
  <div class="wrap">

    <div class="hero">
      <div class="hero-content">
        <div class="roof-mark" aria-hidden="true">
          <svg viewBox="0 0 140 60" fill="none">
            <path d="M15 45L70 15L125 45" stroke="#E38B68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M70 8 L74 16 L70 24 L66 16 Z" fill="#E38B68"/>
            <path d="M62 16 L64.5 20 L62 24 L59.5 20 Z" fill="#E38B68" opacity="0.6"/>
            <path d="M80 12 L82 15 L80 18 L78 15 Z" fill="#E38B68" opacity="0.6"/>
          </svg>
        </div>
        <h1>イワイリフォーム</h1>
        <span class="tagline">リフォームで家と家族が好きになる。</span>
      </div>
    </div>

    <div class="panel">
      <div>
        <nav class="links" aria-label="関連サイトへのリンク">

          <a class="pill" href="https://www.iwai-reform.com/" target="_blank" rel="noopener noreferrer">
            <span class="pill-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 4L4.5 3.5 4.5 4L5 4.5 4.5 5 4.5 4.5Z" stroke="currentColor" stroke-width="0"/>
                <path d="M12 2L13.2 5.6L17 6.2L14.2 8.8L15 12.6L12 10.6L9 12.6L9.8 8.8L7 6.2L10.8 5.6Z" fill="currentColor"/>
              </svg>
            </span>
            <span class="pill-text">
              イワイリフォーム 公式サイト
              <span class="pill-sub">水まわりリフォーム専門サイト</span>
            </span>
            <span class="pill-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>

          <a class="pill" href="https://rinobe-nara-iwai.com/" target="_blank" rel="noopener noreferrer">
            <span class="pill-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 2L13.2 5.6L17 6.2L14.2 8.8L15 12.6L12 10.6L9 12.6L9.8 8.8L7 6.2L10.8 5.6Z" fill="currentColor"/>
              </svg>
            </span>
            <span class="pill-text">
              リノベならイワイ
              <span class="pill-sub">リノベーション専門サイト</span>
            </span>
            <span class="pill-arrow" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>

        </nav>

        <footer>
          <p>株式会社リビングイワイ ｜ 奈良市西ノ京町151</p>
        </footer>
      </div>
    </div>

  </div>
</body>
</html>
